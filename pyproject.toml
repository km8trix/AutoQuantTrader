"native/trusted_time_graceful_stop_v2_resources.h" = "native/trusted_time_graceful_stop_v2_resources.h"
"native/trusted_time_graceful_stop_v2_signer.c" = "native/trusted_time_graceful_stop_v2_signer.c"
"native/trusted_time_graceful_stop_v2_signer.h" = "native/trusted_time_graceful_stop_v2_signer.h"
"native/trusted_time_v2_authority.c" = "native/trusted_time_v2_authority.c"
"native/trusted_time_v2_authority.h" = "native/trusted_time_v2_authority.h"
