[build-system]
requires = [
  "hatchling==1.32.0",
  "packaging==26.3",
  "pathspec==1.1.1",
  "pluggy==1.6.0",
  "tomlkit==0.15.1",
  "trove-classifiers==2026.6.1.19",
]
build-backend = "hatchling.build"

[project]
name = "autoquant-trader"
version = "0.1.0"
description = "A safety-first quantitative algorithmic trading platform."
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.14,<2",
  "cryptography>=49,<50",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "opentelemetry-api>=1.44,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
  "opentelemetry-sdk>=1.44,<2",
  "psycopg[binary]>=3.2,<4",
  "pyarrow>=18,<22",
  "pydantic>=2.10,<3",
  "requests>=2.32,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
autoquant-api = "apps.api.main:run"
autoquant-worker = "apps.worker.main:main"
autoquant-trader = "apps.trader.main:main"
autoquant-trusted-time-supervisor = "apps.trusted_time_supervisor.main:main"
autoquant-trusted-time-first-enrollment = "apps.trusted_time_supervisor.first_enrollment:main"
autoquant-trusted-time-first-enrollment-release = "apps.trusted_time_supervisor.first_enrollment:release_main"
autoquant-trusted-time-post-enrollment-release = "apps.trusted_time_supervisor.post_enrollment_release:release_main"
autoquant-trusted-time-post-enrollment-runtime-state = "apps.trusted_time_supervisor.post_enrollment_runtime_state:runtime_state_main"

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "python-dotenv>=1.0,<2",
  "ruff>=0.9,<1",
]

[tool.uv]
build-constraint-dependencies = [
  "hatchling==1.32.0",
  "packaging==26.3",
  "pathspec==1.1.1",
  "pluggy==1.6.0",
  "tomlkit==0.15.1",
  "trove-classifiers==2026.6.1.19",
]

[tool.hatch.build.targets.wheel]
packages = ["apps", "packages"]
exclude = ["packages/adapters/trusted_time/_bounded_process.py"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "build_support/native_owned_file_descriptor_hook.py"

[tool.hatch.build.targets.sdist]
exclude = ["/.uv-cache", "build_support/build_native_test_launcher.py"]

[tool.hatch.build.targets.sdist.force-include]
"build_support/native_build_constraints.txt" = "build_support/native_build_constraints.txt"
"build_support/build_trusted_time_v2_candidates.py" = "build_support/build_trusted_time_v2_candidates.py"
"build_support/build_trusted_time_v2_linked_role_test.py" = "build_support/build_trusted_time_v2_linked_role_test.py"
"build_support/exercise_trusted_time_v2_exact_candidates.py" = "build_support/exercise_trusted_time_v2_exact_candidates.py"
"build_support/qualify_trusted_time_v2_candidates.py" = "build_support/qualify_trusted_time_v2_candidates.py"
"build_support/smoke_trusted_time_v2_sdist.py" = "build_support/smoke_trusted_time_v2_sdist.py"
"build_support/trusted_time_v2_candidate_execution.Dockerfile" = "build_support/trusted_time_v2_candidate_execution.Dockerfile"
"build_support/trusted_time_v2_candidate_import_roots/host/autoquant_trusted_time_v2_host_entry.py" = "build_support/trusted_time_v2_candidate_import_roots/host/autoquant_trusted_time_v2_host_entry.py"
"build_support/trusted_time_v2_candidate_import_roots/recovery/autoquant_trusted_time_v2_recovery_entry.py" = "build_support/trusted_time_v2_candidate_import_roots/recovery/autoquant_trusted_time_v2_recovery_entry.py"
"build_support/trusted_time_v2_candidate_import_roots/supervisor/autoquant_trusted_time_v2_supervisor_entry.py" = "build_support/trusted_time_v2_candidate_import_roots/supervisor/autoquant_trusted_time_v2_supervisor_entry.py"
"build_support/trusted_time_v2_seccomp_manifests.py" = "build_support/trusted_time_v2_seccomp_manifests.py"
"infra/trusted-time/graceful-stop-v2/seccomp/host.json" = "infra/trusted-time/graceful-stop-v2/seccomp/host.json"
"infra/trusted-time/graceful-stop-v2/seccomp/provisioner.json" = "infra/trusted-time/graceful-stop-v2/seccomp/provisioner.json"
"infra/trusted-time/graceful-stop-v2/seccomp/recovery.json" = "infra/trusted-time/graceful-stop-v2/seccomp/recovery.json"
"infra/trusted-time/graceful-stop-v2/seccomp/supervisor.json" = "infra/trusted-time/graceful-stop-v2/seccomp/supervisor.json"
"build_support/native_image_manifest.py" = "build_support/native_image_manifest.py"
"build_support/native_owned_file_descriptor_hook.py" = "build_support/native_owned_file_descriptor_hook.py"
"native/bounded_process.c" = "native/bounded_process.c"
"native/owned_file_descriptor.c" = "native/owned_file_descriptor.c"
"native/trusted_time_python_launcher.c" = "native/trusted_time_python_launcher.c"
