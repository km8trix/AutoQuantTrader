"native/trusted_time_v2_role_launcher.h" = "native/trusted_time_v2_role_launcher.h"
"native/trusted_time_v2_seccomp.c" = "native/trusted_time_v2_seccomp.c"
"native/trusted_time_v2_seccomp.h" = "native/trusted_time_v2_seccomp.h"
"native/trusted_time_v2_secret_mount_admission.c" = "native/trusted_time_v2_secret_mount_admission.c"
"native/trusted_time_v2_secret_mount_admission.h" = "native/trusted_time_v2_secret_mount_admission.h"
"packages/adapters/trusted_time/_bounded_process.py" = "packages/adapters/trusted_time/_bounded_process.py"
"third_party/monocypher/4.0.3/LICENCE.md" = "third_party/monocypher/4.0.3/LICENCE.md"
"third_party/monocypher/4.0.3/VENDORING.json" = "third_party/monocypher/4.0.3/VENDORING.json"
"third_party/monocypher/4.0.3/src/monocypher.c" = "third_party/monocypher/4.0.3/src/monocypher.c"
"third_party/monocypher/4.0.3/src/monocypher.h" = "third_party/monocypher/4.0.3/src/monocypher.h"
"third_party/monocypher/4.0.3/src/optional/monocypher-ed25519.c" = "third_party/monocypher/4.0.3/src/optional/monocypher-ed25519.c"
"third_party/monocypher/4.0.3/src/optional/monocypher-ed25519.h" = "third_party/monocypher/4.0.3/src/optional/monocypher-ed25519.h"
"tests/native/trusted_time_v2_seccomp_manifest_harness.c" = "tests/native/trusted_time_v2_seccomp_manifest_harness.c"
"tests/fixtures/native/trusted-time-v2/import-roots/host/autoquant_trusted_time_v2_host_entry.py" = "tests/fixtures/native/trusted-time-v2/import-roots/host/autoquant_trusted_time_v2_host_entry.py"
"tests/fixtures/native/trusted-time-v2/import-roots/recovery/autoquant_trusted_time_v2_recovery_entry.py" = "tests/fixtures/native/trusted-time-v2/import-roots/recovery/autoquant_trusted_time_v2_recovery_entry.py"
"tests/fixtures/native/trusted-time-v2/import-roots/supervisor/autoquant_trusted_time_v2_supervisor_entry.py" = "tests/fixtures/native/trusted-time-v2/import-roots/supervisor/autoquant_trusted_time_v2_supervisor_entry.py"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
exclude = ["^migrations/"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
