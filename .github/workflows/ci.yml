name: Personal profile CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Standard Python foundations and retained financial regressions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      SOURCE_DATE_EPOCH: "0"
      AQT_ENVIRONMENT: local
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: autoquant
          POSTGRES_PASSWORD: autoquant
          POSTGRES_DB: autoquant_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U autoquant -d autoquant_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12.13"
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Check architecture before importing project code
        run: uv run --isolated --no-project --no-config --offline --python 3.12 python -I -B scripts/check_personal_architecture.py
      - name: Install locked dependencies without executing project build code
        run: uv sync --all-groups --locked --no-install-project --no-build
      - name: Formatting, lint, types, and API contracts
        run: |
          .venv/bin/ruff format --check .
          .venv/bin/ruff check .
          .venv/bin/mypy apps packages
          .venv/bin/python -B -m scripts.generate_api_contracts --check
      - name: Check migrations against the disposable database
        env:
          AQT_DATABASE_URL: postgresql+psycopg://autoquant:autoquant@localhost:5432/autoquant_test
        run: |
          .venv/bin/alembic upgrade head
          .venv/bin/alembic check
      - name: Foundation suite with an explicit disposable PostgreSQL database
        run: .venv/bin/python -B scripts/run_personal_tests.py --postgres-url postgresql+psycopg://autoquant:autoquant@localhost:5432/autoquant_test
      - name: Build conventional wheel with pinned build dependencies
        run: uv build --wheel --no-sources --build-constraints build_support/native_build_constraints.txt --require-hashes --out-dir "$RUNNER_TEMP/personal-wheel"
      - name: Verify and run installed wheel outside source checkout
        run: |
          .venv/bin/python -B scripts/verify_personal_wheel.py "$RUNNER_TEMP/personal-wheel"
          uv venv "$RUNNER_TEMP/personal-installed" --python 3.12
          uv pip install --python "$RUNNER_TEMP/personal-installed/bin/python" --no-deps "$RUNNER_TEMP"/personal-wheel/*.whl
          cd "$RUNNER_TEMP"
          env -i PATH=/usr/bin:/bin "$RUNNER_TEMP/personal-installed/bin/autoquant-personal-simulation" --instance-lock "$RUNNER_TEMP/personal-runtime.lock" --once
      - name: Validate historical Compose definitions without activation
        run: docker compose --env-file /dev/null -f infra/compose/compose.yaml config --quiet

  frontend:
    name: Browser regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test --run
      - run: pnpm bundle:test
      - run: pnpm build
