# Phase 6C evidence-only local clock source.  This daemon observes the shared
# container clock but is never permitted to set it or serve NTP to another
# process.  Runtime must invoke chronyd with -x.
server time.cloudflare.com iburst nts minpoll 4 maxpoll 4 maxunreach 1
server virginia.time.system76.com iburst nts minpoll 4 maxpoll 4 maxunreach 1

# Both authenticated providers must be selectable.  No pool, unauthenticated
# fallback, local reference, peer, or manual source is configured.
minsources 2
authselectmode require
maxdistance 0.1
ntsaeads 15 30

# Client-only and Unix-socket-only monitoring.  The shared socket is available
# only to the fixed UID/GID used by the source and evidence supervisor.
user autoquant
port 0
cmdport 0
bindcmdaddress /run/chrony/chronyd.sock
pidfile /tmp/chronyd.pid

driftfile /var/lib/chrony/drift
ntsdumpdir /var/lib/chrony/nts
noclientlog
